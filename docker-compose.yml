# yamllint disable rule:line-length
# Long lines here are intentional: SQL_DSN / REDIS_CONN_STRING are single
# interpolations and the env-var comments mirror the upstream compose file;
# neither can shrink below 80 chars.
#
# New-API Docker Compose Configuration (production, direct cloud-server deployment)
#
# Pin the compose project name so every `docker compose` invocation targets the
# same `newapi` project, independent of the directory name.
#
# Quick Start:
#   1. cp .env.example .env && fill in secrets (see .env.example)
#   2. ./start.sh            (prepares /srv/newapi dirs, then compose up)
#   3. Set DOMAIN in .env for automatic HTTPS via Caddy (https://<domain>),
#      or leave DOMAIN empty for plain HTTP on http://<public-ip>
#      (see docker/Caddyfile for the two modes).
#
# Cloudflare Tunnel (optional): the cloudflared service is commented out below.
# To switch to tunnel deployment, uncomment it, set TUNNEL_TOKEN in .env, and
# configure the dashboard ingress to point at http://newapi:3000. In that
# mode, consider stopping caddy (close 80/443) so the edge is the only public
# entry.
#
# Traffic flow (default): client -> caddy :80/:443 (automatic HTTPS) ->
# newapi:3000 (gin streams natively; gin serves the embedded web UI and the
# API from the same port). Caddy handles TLS termination, compression and
# WebSocket/SSE pass-through.
#
# Using MySQL instead of PostgreSQL:
#   1. Comment out the postgres service and the SQL_DSN line
#   2. Uncomment the mysql service and SQL_DSN line
#   3. Uncomment mysql in depends_on
#
# Persistent data lives in host bind mounts (created by start.sh):
#   /srv/newapi/postgres   PostgreSQL cluster
#   /srv/newapi/data       new-api /data (SQLite when used, misc files)
#   /srv/newapi/log        new-api application logs
#   /srv/newapi/caddy      Caddy certificates (/data) + autosave (/config)

---
name: newapi

services:
  newapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: newapi
    restart: always
    command: --log-dir /app/logs
    ports:
      - "127.0.0.1:3000:3000"  # localhost only; caddy is the public entry point (handy for host-side debugging)
    volumes:
      - ${DATA_DIR:-/srv/newapi/data}:/data
      - ${LOG_DIR:-/srv/newapi/log}:/app/logs
    environment:
      - SQL_DSN=postgresql://${POSTGRES_USER:-newapi}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-newapi}
#      - SQL_DSN=${MYSQL_USER:-root}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@tcp(mysql:3306)/newapi  # Uncomment to use the mysql service
#      - LOG_SQL_DSN=postgresql://${POSTGRES_USER:-newapi}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/newapi-log # OPTIONAL: separate database for logging
#      - LOG_SQL_DSN=clickhouse://default:${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}@clickhouse:9000/new_api_logs # OPTIONAL: ClickHouse for logs only; also uncomment clickhouse in depends_on and the clickhouse service below
#      - LOG_SQL_CLICKHOUSE_TTL_DAYS=0 # OPTIONAL: ClickHouse log retention days. Unset or 0 disables automatic deletion; set to e.g. 30 to keep 30 days
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET is required}
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true  # 是否启用错误日志记录 (Whether to enable error log recording)
      - BATCH_UPDATE_ENABLED=true  # 是否启用批量更新 (Whether to enable batch update)
      - NODE_NAME=new-api-node-1  # 节点名称，用于审计日志中标识节点身份；多节点/容器部署时建议设置 (Node name used in audit logs; recommended when running multiple instances or in containers)
#      - STREAMING_TIMEOUT=300  # 流模式无响应超时时间，单位秒，默认120秒，如果出现空补全可以尝试改为更大值 （Streaming timeout in seconds, default is 120s. Increase if experiencing empty completions）
#      - RELAY_IDLE_CONN_TIMEOUT=90  # Relay HTTP 客户端空闲连接超时时间，单位秒，默认跟随 Go 标准库，设置为0表示不限制 (Relay HTTP client idle keep-alive timeout in seconds, defaults to Go standard library; set 0 to disable)
#      - SESSION_COOKIE_SECURE=true  # true：启用 Secure Refresh Cookie 和严格 refresh/logout OriginGuard；false/未配置：关闭 OriginGuard，仅用于本地 HTTP (true: Secure cookie + strict refresh/logout OriginGuard; false/unset: guard disabled for local HTTP only)
#      - SESSION_COOKIE_TRUSTED_URL=https://example.com,https://admin.example.com  # Secure=true 时必填的精确 HTTPS Origin；不是 relay CORS 白名单，不支持通配符/路径 (Required exact HTTPS origins when Secure=true; not a relay CORS allowlist, no wildcard/path)
#      - TRUSTED_PROXIES=none  # 容器流量来自 cloudflared 容器（RFC1918），按需设置；未配置时信任回环/RFC1918/fc00::/7 并告警，none 为严格模式 (Unset trusts loopback/RFC 1918/fc00::/7 with a warning; none trusts no proxies; an explicit list replaces defaults)
#      - USER_SESSION_ACTIVE_LIMIT=50
#      - USER_SESSION_ISSUANCE_LIMIT=100
#      - USER_SESSION_ISSUANCE_WINDOW_SECONDS=86400  # 不得大于 revoked 保留期 (must not exceed revoked retention)
#      - USER_SESSION_REVOKED_RETENTION_DAYS=7
#      - USER_SESSION_HOURLY_ALERT_THRESHOLD=5000  # 仅告警，不做全局拒绝 (alert only; never globally rejects login)
#      - SYNC_FREQUENCY=60  # Uncomment if regular database syncing is needed
#      - GOOGLE_ANALYTICS_ID=G-XXXXXXXXXX  # Google Analytics 的测量 ID (Google Analytics Measurement ID)
#      - UMAMI_WEBSITE_ID=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx  # Umami 网站 ID (Umami ID)
#      - UMAMI_SCRIPT_URL=https://analytics.umami.is/script.js  # Umami 脚本 URL，默认为官方地址 (Umami Script URL, defaults to official address)

    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
#      mysql:  # Uncomment if using MySQL
#        condition: service_healthy
#      clickhouse:  # Uncomment if using ClickHouse for LOG_SQL_DSN
#        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:8-alpine
    container_name: redis
    restart: always
    # No host port: Redis is an internal cache reachable only from the newapi
    # container.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    # Expose the password to the container so the healthcheck can authenticate.
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:18.6
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-newapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-newapi}
      # postgres:18 moved the default PGDATA to /var/lib/postgresql/<major>/docker;
      # pin it back to the bind-mount path so the cluster keeps living directly in
      # the host directory (same layout as postgres:15).
      PGDATA: /var/lib/postgresql/data
    volumes:
      # Bind-mount the PostgreSQL cluster onto the host. `start.sh` ensures this
      # directory exists and is owned by the postgres user (UID:GID 999), since
      # the official image refuses to initdb a bind mount it cannot write to.
      - ${PGDATA_DIR:-/srv/newapi/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

