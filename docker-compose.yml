#  clickhouse:
#    image: clickhouse/clickhouse-server:24.8
#    container_name: clickhouse
#    restart: always
#    environment:
#      CLICKHOUSE_DB: new_api_logs
#      CLICKHOUSE_USER: default
#      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
#      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
#    volumes:
#      # Created manually on the host (start.sh only prepares the postgres dir):
#      #   mkdir -p /srv/newapi/clickhouse
#      - /srv/newapi/clickhouse:/var/lib/clickhouse
#    healthcheck:
#      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8123/ping || exit 1"]
#      interval: 5s
#      timeout: 5s
#      retries: 10

  caddy:
    # Public entry point: automatic HTTPS (Let's Encrypt) when DOMAIN is set,
    # plain HTTP on :80 otherwise. See docker/Caddyfile for the two modes.
    image: caddy:2-alpine
    container_name: caddy
    restart: always
    depends_on:
      - newapi
    environment:
      # Empty/unset DOMAIN resolves to ":80" (plain HTTP catch-all); set a
      # domain name in .env for automatic HTTPS.
      DOMAIN: ${DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"  # only used when DOMAIN is set (HTTPS)
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME state MUST survive container recreation:
      # /data (certs) + /config (auto-save) live under /srv/newapi/caddy
      # (created by start.sh).
      - ${CADDY_DATA_DIR:-/srv/newapi/caddy/data}:/data
      - ${CADDY_CONFIG_DIR:-/srv/newapi/caddy/config}:/config

#  cloudflared:
